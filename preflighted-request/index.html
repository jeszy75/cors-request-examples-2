<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Content-Security-Policy" content="upgrade-insecure-requests
">
    <title>Preflighted CORS Request Example</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body class="bg-body-secondary">
    <main class="vh-100 d-flex justify-content-center align-items-center">
        <div class="container" style="max-width: 800px">
            <h1 class="display-3 fw-semibold text-center mb-5">
                Math.js Calculator
            </h1>
            <form id="calculator">
                <label for="expression" class="form-label fs-5">
                    Enter an expression
                </label>
                <div class="input-group input-group-lg">
                    <input type="text"
                        id="expression"
                        class="form-control"
                        value="3.5 inch in cm">
                    <button type="submit" class="btn btn-primary px-4">
                        Calculate
                    </button>
                </div>
                <div class="text-center mt-5">
                    <label for="result" class="form-label d-block text-secondary">Result</label>
                    <output for="expression" id="result" class="display-6 fw-semibold"></output>
                </div>
            </form>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
